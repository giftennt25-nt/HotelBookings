<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hotel Room Booking</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="assets/css/style.css" rel="stylesheet"/>
  
</head>
<body>

  <!--TOPBAR  -->
  <div class="topbar">
    <h4><i class="fas fa-hotel me-2"></i>Hotel Room Booking</h4>
    <div class="search-bar">
      <i class="fas fa-search"></i>
      Search Booking ID / Guest Name
    </div>
  </div>

  <div class="container-fluid px-4 pb-4">
    <div class="row g-3">

      <!-- DATE SELECTION  -->
      <div class="col-lg-4">
        <div class="section-header">
          1. Select Dates
        </div>
        <div class="section-body">

          <div class="mb-3">
            <label class="form-label">Check-in Date</label>
            <input
              type="date"
              class="form-control"
              id="checkin"
              onchange="handleDateChange()"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Check-out Date</label>
            <input
              type="date"
              class="form-control"
              id="checkout"
              onchange="handleDateChange()"
            />
          </div>

          <!-- Filter -->
          <div class="mb-3">
            <label class="form-label">Filter by Max Guests</label>
            <select
              class="form-select"
              id="guestFilter"
              onchange="renderRooms()">
              <option value="0">All Rooms</option>
              <option value="2">Up to 2 Guests</option>
              <option value="3">Up to 3 Guests</option>
              <option value="4">Up to 4 Guests</option>
            </select>
          </div>

          <!-- Date Error -->
          <div class="alert alert-danger py-2 d-none" id="dateAlert">
            <i class="fas fa-exclamation-triangle me-1"></i>
            <span id="dateAlertMsg"></span>
          </div>

        </div>
      </div>

      <!-- ROOM SELECTION  -->
      <div class="col-lg-5">
        <div class="section-header">
          2. Select a Room
        </div>
        
        <div class="section-body">

          <div class="row g-2" id="roomList"></div>

          <!-- Room Error -->
          <div class="alert alert-danger py-2 mt-3 d-none" id="roomAlert">
            <i class="fas fa-exclamation-triangle me-1"></i>
            <span id="roomAlertMsg"></span>
          </div>

        </div>
      </div>

      <!--  SUMMARY & PAYMENT  -->
      <div class="col-lg-3">
        <div class="section-header">
          3. Booking Summary
        </div>
        <div class="section-body">

          <!-- Calculate Button -->
          <button
            class="btn-primary-custom mb-3"
            onclick="calculateBooking()">
            <i class="fas fa-calculator me-2"></i>
            Calculate Total
          </button>

          <!-- Summary -->
          <div id="summarySection" class="d-none">

            <div class="summary-title">
              <i class="fas fa-receipt me-2"></i>
              Bill Details
            </div>

            <div class="summary-row">
              <span>Room</span>
              <span id="summaryRoom"></span>
            </div>

            <div class="summary-row">
              <span>Check-in</span>
              <span id="summaryCheckin"></span>
            </div>

            <div class="summary-row">
              <span>Check-out</span>
              <span id="summaryCheckout"></span>
            </div>

            <div class="summary-row">
              <span>Nights</span>
              <span id="summaryNights"></span>
            </div>

            <div class="summary-row">
              <span>Rate / Night</span>
              <span id="summaryPricePerNight"></span>
            </div>

            <div class="summary-row total-row">
              <span>Total Amount</span>
              <span id="summaryTotal"></span>
            </div>

            <!-- Payment method -->
            <div class="mt-3">
              <label class="form-label">Payment Method</label>
              <select class="form-select">
                <option>Credit Card</option>
                <option>Cash</option>
                <option>M-Pay</option>
              </select>
            </div>

            <button class="btn-primary-custom mt-3">
              <i class="fas fa-check me-2"></i>
              Complete Booking
            </button>

            <button class="btn-outline-custom">
              <i class="fas fa-print me-2"></i>
              Print Invoice
            </button>

          </div>

          <!-- Placeholder when no summary -->
          <div id="summaryPlaceholder" class="text-center text-muted py-4">
            <i class="fas fa-bed fa-2x mb-2 d-block"></i>
            <small>Select dates and a room, then click Calculate Total</small>
          </div>

        </div>
      </div>

    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>


<script src="assets/js/main.js"></script>




  

</body>
</html>
